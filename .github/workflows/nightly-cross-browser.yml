# Extended regression: the same Dockerized Playwright suite on Chromium, Firefox and WebKit.
# Runs on a schedule and on demand; it is NOT required for pull requests or the classroom demo.

name: Nightly Cross-Browser Regression

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker Compose reads COMPOSE_FILE natively, so every step below uses plain `docker compose ...`
  # with exactly the same files as the local demo (`./scripts/demo.sh ci`).
  COMPOSE_FILE: compose.yml:compose.demo.yml:compose.ci.yml

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PW_BROWSERS: ${{ matrix.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Playwright tests as the runner user (artifacts stay writable)
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose --profile test build

      - name: Run E2E quality gate (${{ matrix.browser }})
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color db backend frontend

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
