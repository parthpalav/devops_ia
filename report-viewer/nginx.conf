server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Landing page with links to every demo phase.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # Raw artifacts: Playwright HTML reports, results.json, screenshots, videos, traces, backend logs.
    location /reports/ {
        autoindex on;
        autoindex_exact_size off;
        # Reports are regenerated on every run - never serve stale copies.
        add_header Cache-Control "no-store";
        types {
            text/html                html;
            text/css                 css;
            application/javascript   js mjs;
            application/json         json;
            text/plain               log md txt;
            image/png                png;
            image/jpeg               jpg jpeg;
            image/svg+xml            svg;
            video/webm               webm;
            application/zip          zip;
            font/woff2               woff2;
            font/woff                woff;
            font/ttf                 ttf;
        }
    }
}
